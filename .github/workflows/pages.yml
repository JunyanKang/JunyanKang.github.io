name: Publish Kang Lab
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - run: npm ci --prefix atlas
      - run: npm test --prefix atlas
      - run: node --test tests/*.test.mjs
      - run: bundle exec ruby tests/software_test.rb
      - run: bundle exec ruby tests/publications_test.rb
      - run: bundle exec ruby tests/news_test.rb
      - run: bundle exec ruby tests/external_resources_test.rb
      - run: bundle exec ruby tests/team_test.rb
      - run: bundle exec ruby tests/contact_test.rb
      - run: node scripts/build.mjs
        env:
          VITE_RETINA_ATLAS_BASE: https://raw.githubusercontent.com/JunyanKang/retina-atlas-data/atlas-v1
          AMAP_WEB_SERVICE_KEY: ${{ github.event_name != 'pull_request' && secrets.AMAP_WEB_SERVICE_KEY || '' }}
          REQUIRE_CONTACT_MAP: ${{ github.event_name != 'pull_request' }}
      - name: Include same-origin retinal query files
        run: |
          set -eu
          data="$RUNNER_TEMP/retina-v1"
          git init -q "$data"
          git -C "$data" remote add origin https://github.com/JunyanKang/retina-atlas-data.git
          git -C "$data" config remote.origin.promisor true
          git -C "$data" config remote.origin.partialclonefilter blob:none
          git -C "$data" fetch -q --filter=blob:none --depth=1 origin 6606bed1fd8d4c8d9c6bb7abbec10f0b742ddd50
          { printf '%s\n' '/mouse_dev_space/' '*.json.gz'; jq -r '.[] | "/" + .' atlas/shared/pages-blocks.json; } |
            git -C "$data" sparse-checkout set --no-cone --stdin
          git -C "$data" checkout -q --detach FETCH_HEAD
          mkdir -p _site/assets/retina-atlas-v1
          rsync -a --exclude='.git/' --include='*/' --include='*.gz' --exclude='*' "$data/" _site/assets/retina-atlas-v1/
          test -s _site/assets/retina-atlas-v1/mouse_dev_space/layer0-150.bin.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
