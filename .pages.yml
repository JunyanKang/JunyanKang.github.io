---
media:
  input: assets/img
  output: "/assets/img"
  categories:
  - image
content:
- name: team
  label: 成员与照片 / Team
  type: file
  path: _data/team.json
  format: json
  fields:
  - name: pi
    label: PI profile
    type: object
    fields:
    - name: name
      label: English name (given name first)
      type: string
    - name: name_zh
      label: 中文姓名（仅后台，不在网页显示）
      type: string
    - name: photo
      label: Portrait
      type: image
    - name: position
      label: Position
      type: string
    - name: primary_affiliation
      label: 第一单位 / Primary affiliation
      type: string
    - name: affiliation
      label: Affiliation
      type: text
    - name: orcid
      label: ORCID URL
      type: string
  - name: members
    label: Members
    type: object
    description: 点击成员姓名展开，在姓名下方上传或更换头像照片，完成后点击页面右上角 Save。
    list:
      collapsible:
        collapsed: true
        summary: "{name} · {role}"
    fields:
    - name: name
      label: English name / 英文姓名
      type: string
      required: true
      description: "Given name first, family name last; for example, Lu-Yue Ding."
    - name: photo
      label: 头像照片 / Member photo
      type: image
      description: 上传本人照片，或从 Media 选择已有照片。可选；照片将在公开 Team 页面显示。
    - name: photo_framing
      label: 照片取景 / Framing
      type: select
      description: 全身或长幅照片选择上半身；已裁好的头像选择原比例。只改变展示取景，不修改原照片。
      options:
        values:
        - name: portrait
          label: 原比例头像
        - name: upper-body
          label: 上半身取景
    - name: year
      label: Entry year
      type: number
      required: true
    - name: role
      label: Role / 培养类型
      type: select
      required: true
      options:
        values:
        - name: Direct-entry PhD student
          label: Direct-entry PhD student / 直博生
        - name: PhD student
          label: PhD student / 普博生
        - name: Master's student
          label: Master's student / 硕士生
        - name: Postdoctoral fellow
          label: Postdoctoral fellow / 博士后
        - name: Research assistant
          label: Research assistant / 助研
    - name: group
      label: Display group
      type: select
      required: true
      options:
        values:
        - name: researchers
          label: Research staff / 科研人员
        - name: doctoral
          label: Doctoral students / 博士生
        - name: masters
          label: Master students / 硕士生
        - name: alumni
          label: Alumni / 毕业生
    - name: graduation_year
      label: 毕业年份 / Graduation year
      type: number
      description: 仅毕业生填写，可留空。将 Display group 设置为 Alumni 后显示在毕业生分类。
    - name: region
      label: Home region / 籍贯省份
      type: select
      required: true
      options:
        values:
        - name: '110000'
          label: 北京市
        - name: '120000'
          label: 天津市
        - name: '130000'
          label: 河北省
        - name: '140000'
          label: 山西省
        - name: '150000'
          label: 内蒙古自治区
        - name: '210000'
          label: 辽宁省
        - name: '220000'
          label: 吉林省
        - name: '230000'
          label: 黑龙江省
        - name: '310000'
          label: 上海市
        - name: '320000'
          label: 江苏省
        - name: '330000'
          label: 浙江省
        - name: '340000'
          label: 安徽省
        - name: '350000'
          label: 福建省
        - name: '360000'
          label: 江西省
        - name: '370000'
          label: 山东省
        - name: '410000'
          label: 河南省
        - name: '420000'
          label: 湖北省
        - name: '430000'
          label: 湖南省
        - name: '440000'
          label: 广东省
        - name: '450000'
          label: 广西壮族自治区
        - name: '460000'
          label: 海南省
        - name: '500000'
          label: 重庆市
        - name: '510000'
          label: 四川省
        - name: '520000'
          label: 贵州省
        - name: '530000'
          label: 云南省
        - name: '540000'
          label: 西藏自治区
        - name: '610000'
          label: 陕西省
        - name: '620000'
          label: 甘肃省
        - name: '630000'
          label: 青海省
        - name: '640000'
          label: 宁夏回族自治区
        - name: '650000'
          label: 新疆维吾尔自治区
        - name: '710000'
          label: 台湾省
        - name: '810000'
          label: 香港特别行政区
        - name: '820000'
          label: 澳门特别行政区
    - name: hometown
      label: Hometown (English) / 籍贯英文
      type: string
      description: 使用英文，例如 Shaoxing, Zhejiang；只提供省份时不补写城市。
    - name: bio
      label: Research interests / Short biography (English)
      type: text
      description: 使用英文，例如 Retinal development 或 Retinal aging。
- name: publications
  label: 论文 / Publications
  type: file
  path: _data/publications_manual.json
  format: json
  fields:
  - name: items
    label: 全部论文 / All publications
    type: object
    description: 包含现有全部论文。展开条目可编辑；可新增、隐藏或删除。保存后网站自动更新，后续 ORCID 导入不会覆盖已有编辑。
    list:
      collapsible:
        collapsed: true
        summary: "{year} · {title}"
    fields:
    - name: title
      label: Title
      type: string
      required: true
    - name: year
      label: Year
      type: number
      required: true
    - name: doi
      label: DOI
      type: string
    - name: journal
      label: Journal
      type: string
    - name: author_entries
      label: Authors / 作者与身份
      type: object
      description: "* First author · # Corresponding author"
      list:
        collapsible:
          collapsed: true
          summary: "{name}"
      fields:
      - name: name
        label: Full name / 作者姓名
        type: string
        required: true
      - name: first_author
        label: First author (*) / 第一作者
        type: boolean
        description: 支持多位共同第一作者；依据论文明确署名勾选。
      - name: corresponding_author
        label: Corresponding author (#) / 通讯作者
        type: boolean
        description: 支持多位共同通讯作者，也可同时勾选第一作者。
    - name: url
      label: HTTPS link (only required without DOI)
      type: string
    - name: selected
      label: Feature on homepage
      type: boolean
    - name: hidden
      label: Hide this DOI from public list
      type: boolean
    - name: preview
      label: 悬停配图 / Figure preview
      type: object
      description: 使用本文原图，保留坐标与标签。更换图片时请清空下方裁剪参数，以显示新图全貌。
      fields:
      - name: image
        label: 图片 / Image
        type: image
      - name: label
        label: 图号或简短标题 / Figure label
        type: string
      - name: alt
        label: 图像说明 / Accessible description
        type: text
      - name: source
        label: 原文或图片来源 / Source URL
        type: string
      - name: credit
        label: 作者、期刊与版权 / Credit
        type: string
      - name: crop
        label: 可选展示裁剪 / Optional crop
        type: object
        description: 仅改变展示窗口，不修改原图。整图展示时全部留空；选择某个 panel 时必须保留该 panel 完整坐标及标签。
        fields:
        - {name: x, label: Left (px), type: number}
        - {name: y, label: Top (px), type: number}
        - {name: width, label: Panel width (px), type: number}
        - {name: height, label: Panel height (px), type: number}
        - {name: source_width, label: Original width (px), type: number}
        - {name: source_height, label: Original height (px), type: number}
- name: software
  label: 软件 / Software
  type: file
  path: _data/software.yml
  format: yaml
  fields:
  - name: groups
    label: Categories
    type: object
    list: true
    fields:
    - name: id
      label: ID
      type: string
    - name: title
      label: Title
      type: string
    - name: description
      label: Description
      type: string
  - name: projects
    label: Projects
    type: object
    description: 展开工具后设置“在网站显示”。新建工具请填写信息并开启此开关后保存；隐藏不等于保密，公共仓库仍可查看记录。
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
    - name: title
      label: Project name
      type: string
      required: true
    - name: visible
      label: 在网站显示 / Show on website
      type: boolean
      description: 关闭时从 Resources 隐藏，但保留后台记录，随时可以恢复。
    - name: recommended
      label: 推荐 / Recommended
      type: boolean
      description: 开启后在软件卡片右上角显示推荐星标；关闭则不显示，不影响软件排序。
    - name: group
      label: Category
      type: select
      required: true
      options:
        values:
        - name: genomics
          label: Genomics & data analysis
        - name: imaging
          label: Imaging & phenotyping
        - name: productivity
          label: Research productivity
    - name: category
      label: Specialty label
      type: string
    - name: description
      label: Description
      type: text
    - name: url
      label: GitHub URL
      type: string
      required: true
    - name: upstream
      label: Original project (fork only)
      type: string
    - name: releases
      label: Releases URL
      type: string
    - name: license
      label: License
      type: string
- name: contact
  label: 联系信息 / Contact
  type: file
  path: _data/contact.json
  format: json
  fields:
  - name: email
    label: Email
    type: string
    required: true
  - name: address_zh
    label: 中文地址
    type: string
    required: true
  - name: address_en
    label: English address
    type: string
  - name: affiliation
    label: Institution
    type: text
