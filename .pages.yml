---
media:
  input: assets/img
  output: "/assets/img"
  categories:
  - image
content:
- name: news
  label: 新闻编辑与发布 / News
  type: collection
  path: _news
  format: yaml-frontmatter
  filename: "{primary}.md"
  subfolders: false
  view:
    fields: [title, published, date, category, show_in_hero]
    primary: title
    sort: [date, title]
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: 新闻标题 / Title
    type: string
    required: true
  - name: date
    label: 新闻日期 / Date
    type: date
    required: true
  - name: category
    label: 分类 / Category
    type: select
    options:
      values: [Publication, Resource, Lab life, Event]
    default: Lab life
    required: true
  - name: summary
    label: 摘要 / Summary
    type: text
    required: true
  - name: image
    label: 封面图片 / Cover
    type: image
    required: true
  - name: image_alt
    label: 图片描述 / Accessible image description
    type: string
    required: true
  - name: image_fit
    label: 图片显示方式 / Image fit
    type: select
    options:
      values:
      - name: contain
        label: 完整显示（论文图件或 Logo）
      - name: cover
        label: 填满画面（活动照片）
    default: contain
    description: 论文新闻始终完整显示原图，轮播文字置于图片下方，不裁切或遮挡数据。
  - name: image_presentation
    label: 活动照片取景 / Photo framing
    type: select
    options:
      values:
      - name: original
        label: 原图显示
      - name: team-photo
        label: 团队合照（收紧构图并轻度提亮）
      - name: conference-photo
        label: 会议照片（减少顶部留白并轻度提亮）
    default: original
    description: 只调整网页展示，不修改原照片中的人物、文字或数据。
  - name: image_credit
    label: 图片来源（集中致谢页） / Image credit
    type: text
  - name: image_source_url
    label: 原始图片来源网址 / Original image URL
    type: string
  - name: image_license_url
    label: 图片许可网址 / Image licence URL
    type: string
  - name: published
    label: 发布到网站 / Published
    type: boolean
    default: false
    description: 关闭为草稿，开启后保存即可随网站构建发布。公开仓库中的草稿文件仍可被访问，请勿写入保密信息。
  - name: show_in_hero
    label: 加入首页轮播 / Feature in homepage carousel
    type: boolean
    default: false
    description: 仅已发布新闻可加入轮播；点击轮播图跳转到这篇新闻。
  - name: hero_title
    label: 轮播短标题 / Short carousel title
    type: string
    description: 留空时使用新闻标题。
  - name: hero_order
    label: 轮播顺序 / Carousel order
    type: number
    default: 10
    description: 数字小的排在前面。
  - name: link
    label: 相关链接 / Related link
    type: string
    description: 可填写 https:// 开头的论文链接，或 /expression-atlas/ 等站内路径。
  - name: link_label
    label: 链接文字 / Link label
    type: string
  - name: body
    label: 新闻正文 / Article body
    type: rich-text
    required: true
- name: team
  label: 成员与照片 / Team
  type: file
  path: _data/team.json
  format: json
  fields:
  - name: pi
    label: PI profile
    type: object
    fields:
    - name: name
      label: English name (given name first)
      type: string
    - name: name_zh
      label: 中文姓名（仅后台，不在网页显示）
      type: string
    - name: photo
      label: Portrait
      type: image
      description: "上传前请压缩至 200 KB 以内，建议 JPG 或 WebP；推荐竖版宽高比 4:5，例如 640 × 800 像素。保留完整头部和肩部，人物居中、两侧留白均衡。后台不会自动压缩原图，大文件可能上传失败（413）。也可从 Media 选择已上传照片。"
    - name: position
      label: Position
      type: string
    - name: primary_affiliation
      label: 第一单位 / Primary affiliation
      type: string
    - name: affiliation
      label: Affiliation
      type: text
    - name: orcid
      label: ORCID URL
      type: string
  - name: members
    label: Members
    type: object
    description: 点击成员姓名展开，在姓名下方上传或更换头像照片，完成后点击页面右上角 Save。
    list:
      collapsible:
        collapsed: true
        summary: "{name} · {role}"
    fields:
    - name: name
      label: English name / 英文姓名
      type: string
      required: true
      description: "Given name first, family name last; for example, Lu-Yue Ding."
    - name: photo
      label: 头像照片 / Member photo
      type: image
      description: "上传前请压缩至 200 KB 以内，建议 JPG 或 WebP；推荐竖版宽高比 4:5，例如 640 × 800 像素。保留完整头部和肩部，人物居中、两侧留白均衡。已裁好头像选择“原比例头像”。后台不会自动压缩原图，大文件可能上传失败（413）。也可从 Media 选择已有照片。可选；照片将在公开 Team 页面显示。"
    - name: photo_framing
      label: 照片取景 / Framing
      type: select
      description: 全身或长幅照片选择上半身；已裁好的头像选择原比例。只改变展示取景，不修改原照片。
      options:
        values:
        - name: portrait
          label: 原比例头像
        - name: upper-body
          label: 上半身取景
    - name: photo_center_x
      label: 横向取景中心 / Horizontal crop center
      type: number
      description: "上半身取景使用，35–65，默认 50。人物偏右时增大，偏左时减小；用于平衡肩膀两侧留白，不修改原图。"
    - name: photo_scale
      label: 取景放大比例 / Crop scale
      type: number
      description: "上半身取景使用，150–220，默认 175。数值越小，肩部范围越宽。成员卡片与地图悬浮卡片共用此设置。"
    - name: year
      label: Entry year
      type: number
      required: true
    - name: role
      label: Role / 培养类型
      type: select
      required: true
      options:
        values:
        - name: PhD student
          label: PhD student / 博士生
        - name: Master's student
          label: Master's student / 硕士生
        - name: PhD graduate
          label: PhD graduate / 博士毕业生
        - name: Master's graduate
          label: Master's graduate / 硕士毕业生
        - name: Postdoctoral fellow
          label: Postdoctoral fellow / 博士后
        - name: Research assistant
          label: Research assistant / 助研
    - name: group
      label: Display group
      type: select
      description: "选择 Alumni 后，网页会自动将 student 显示为 graduate，并显示已填写的毕业年份。"
      required: true
      options:
        values:
        - name: researchers
          label: Research staff / 科研人员
        - name: doctoral
          label: Doctoral students / 博士生
        - name: masters
          label: Master students / 硕士生
        - name: alumni
          label: Alumni / 毕业生
    - name: graduation_year
      label: 毕业年份 / Graduation year
      type: number
      description: 仅毕业生填写，可留空。将 Display group 设置为 Alumni 后显示在毕业生分类。
    - name: region
      label: Home region / 籍贯省份
      type: select
      required: true
      options:
        values:
        - name: '110000'
          label: 北京市
        - name: '120000'
          label: 天津市
        - name: '130000'
          label: 河北省
        - name: '140000'
          label: 山西省
        - name: '150000'
          label: 内蒙古自治区
        - name: '210000'
          label: 辽宁省
        - name: '220000'
          label: 吉林省
        - name: '230000'
          label: 黑龙江省
        - name: '310000'
          label: 上海市
        - name: '320000'
          label: 江苏省
        - name: '330000'
          label: 浙江省
        - name: '340000'
          label: 安徽省
        - name: '350000'
          label: 福建省
        - name: '360000'
          label: 江西省
        - name: '370000'
          label: 山东省
        - name: '410000'
          label: 河南省
        - name: '420000'
          label: 湖北省
        - name: '430000'
          label: 湖南省
        - name: '440000'
          label: 广东省
        - name: '450000'
          label: 广西壮族自治区
        - name: '460000'
          label: 海南省
        - name: '500000'
          label: 重庆市
        - name: '510000'
          label: 四川省
        - name: '520000'
          label: 贵州省
        - name: '530000'
          label: 云南省
        - name: '540000'
          label: 西藏自治区
        - name: '610000'
          label: 陕西省
        - name: '620000'
          label: 甘肃省
        - name: '630000'
          label: 青海省
        - name: '640000'
          label: 宁夏回族自治区
        - name: '650000'
          label: 新疆维吾尔自治区
        - name: '710000'
          label: 台湾省
        - name: '810000'
          label: 香港特别行政区
        - name: '820000'
          label: 澳门特别行政区
    - name: hometown
      label: Hometown (English) / 籍贯英文
      type: string
      description: 使用英文，例如 Shaoxing, Zhejiang；只提供省份时不补写城市。
    - name: bio
      label: Research interests / Short biography (English)
      type: text
      description: 使用英文，例如 Retinal development 或 Retinal aging。
- name: publications
  label: 论文 / Publications
  type: file
  path: _data/publications_manual.json
  format: json
  fields:
  - name: items
    label: 全部论文 / All publications
    type: object
    description: 包含现有全部论文。展开条目可编辑；可新增、隐藏或删除。保存后网站自动更新，后续 ORCID 导入不会覆盖已有编辑。
    list:
      collapsible:
        collapsed: true
        summary: "{year} · {title}"
    fields:
    - name: title
      label: Title
      type: string
      required: true
    - name: year
      label: Year
      type: number
      required: true
    - name: doi
      label: DOI
      type: string
    - name: journal
      label: Journal
      type: string
    - name: author_entries
      label: Authors / 作者与身份
      type: object
      description: "* First author · # Corresponding author"
      list:
        collapsible:
          collapsed: true
          summary: "{name}"
      fields:
      - name: name
        label: Full name / 作者姓名
        type: string
        required: true
      - name: first_author
        label: First author (*) / 第一作者
        type: boolean
        description: 支持多位共同第一作者；依据论文明确署名勾选。
      - name: corresponding_author
        label: Corresponding author (#) / 通讯作者
        type: boolean
        description: 支持多位共同通讯作者，也可同时勾选第一作者。
    - name: url
      label: HTTPS link (only required without DOI)
      type: string
    - name: selected
      label: Feature on homepage
      type: boolean
    - name: hidden
      label: Hide this DOI from public list
      type: boolean
    - name: preview
      label: 悬停配图 / Figure preview
      type: object
      description: 使用本文原图，保留坐标与标签。更换图片时请清空下方裁剪参数，以显示新图全貌。
      fields:
      - name: image
        label: 图片 / Image
        type: image
      - name: label
        label: 图号或简短标题 / Figure label
        type: string
      - name: alt
        label: 图像说明 / Accessible description
        type: text
      - name: source
        label: 原文或图片来源 / Source URL
        type: string
      - name: credit
        label: 作者、期刊与版权 / Credit
        type: string
      - name: crop
        label: 可选展示裁剪 / Optional crop
        type: object
        description: 仅改变展示窗口，不修改原图。整图展示时全部留空；选择某个 panel 时必须保留该 panel 完整坐标及标签。
        fields:
        - {name: x, label: Left (px), type: number}
        - {name: y, label: Top (px), type: number}
        - {name: width, label: Panel width (px), type: number}
        - {name: height, label: Panel height (px), type: number}
        - {name: source_width, label: Original width (px), type: number}
        - {name: source_height, label: Original height (px), type: number}
- name: external_resources
  label: 外部资源链接 / External resources
  type: file
  path: _data/external_resources.yml
  format: yaml
  fields:
  - name: groups
    label: 分类 / Categories
    type: object
    list: true
    fields:
    - name: id
      type: string
      required: true
      label: Category ID (databases, tools, labs)
    - name: title
      type: string
      required: true
      label: English category title
  - name: items
    label: 外部链接 / Links
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
    - name: title
      label: 名称 / English title
      type: string
      required: true
    - name: group
      label: 分类 / Category
      type: select
      options:
        values: [databases, tools, labs]
      required: true
    - name: description
      label: 简介 / Short English description
      type: text
      required: true
    - name: provider
      label: 提供方或单位 / Provider or institution
      type: string
    - name: image
      label: 官方 Logo 或头像 / Logo or portrait
      type: image
      description: 上传官网标识或负责人公开头像；保留原图，不使用虚构肖像。留空时显示名称首字母。
    - name: image_kind
      label: 图片类型 / Image type
      type: select
      options:
        values: [logo, portrait]
      default: logo
      description: Logo 完整显示；portrait 使用圆形头像取景。
    - name: image_alt
      label: 图片描述 / Image description
      type: string
    - name: image_source
      label: 图片来源 / Official image source
      type: string
      description: 填写该标识或头像所在的官方 HTTPS 页面，方便核对来源。
    - name: url
      label: 官方网址 / Official HTTPS URL
      type: string
      required: true
      description: 只填写公开的 https:// 链接，不要填写本地地址、占位网址或私人联系方式。
    - name: order
      label: 分类内排序 / Order within category
      type: number
      default: 10
      required: true
    - name: visible
      label: 在网站显示 / Visible
      type: boolean
      default: false
- name: software
  label: 软件 / Software
  type: file
  path: _data/software.yml
  format: yaml
  fields:
  - name: groups
    label: Categories
    type: object
    list: true
    fields:
    - name: id
      label: ID
      type: string
    - name: title
      label: Title
      type: string
    - name: description
      label: Description
      type: string
  - name: projects
    label: Projects
    type: object
    description: 展开工具后设置“在网站显示”。新建工具请填写信息并开启此开关后保存；隐藏不等于保密，公共仓库仍可查看记录。
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
    - name: title
      label: Project name
      type: string
      required: true
    - name: visible
      label: 在网站显示 / Show on website
      type: boolean
      description: 关闭时从 Resources 隐藏，但保留后台记录，随时可以恢复。
    - name: recommended
      label: 推荐 / Recommended
      type: boolean
      description: 开启后在软件卡片右上角显示点赞推荐图标；关闭则不显示，不影响软件排序。
    - name: group
      label: Category
      type: select
      required: true
      options:
        values:
        - name: genomics
          label: Genomics & data analysis
        - name: imaging
          label: Imaging & phenotyping
        - name: productivity
          label: Research productivity
    - name: category
      label: Specialty label
      type: string
    - name: description
      label: Description
      type: text
    - name: url
      label: GitHub URL
      type: string
      required: true
    - name: upstream
      label: Original project (fork only)
      type: string
    - name: releases
      label: Releases URL
      type: string
    - name: license
      label: License
      type: string
- name: contact
  label: 联系信息 / Contact
  type: file
  path: _data/contact.json
  format: json
  fields:
  - name: email
    label: Email
    type: string
    required: true
  - name: address_zh
    label: 中文地址
    type: string
    required: true
  - name: address_en
    label: English address
    type: string
  - name: affiliation
    label: Institution
    type: text
  - name: recruitment
    label: 招聘信息 / Recruitment
    type: object
    fields:
    - name: enabled
      label: 显示招聘信息 / Show recruitment
      type: boolean
      default: false
    - name: title
      label: 招聘标题（英文） / Title
      type: string
    - name: description
      label: 应聘材料要求（英文） / Application instructions
      type: text
    - name: email
      label: 简历接收邮箱 / Application email
      type: string
      description: 留空时使用上方 Contact 邮箱。
    - name: subject
      label: 邮件主题格式 / Email subject format
      type: string
    - name: closing
      label: 招聘期限与结语（英文） / Closing text
      type: text
