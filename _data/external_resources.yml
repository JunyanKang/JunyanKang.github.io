# Official public destinations curated on 2026-09-30; not legacy demo data.
groups:
  - id: databases
    title: Databases & atlases
  - id: tools
    title: Analysis tools
  - id: labs
    title: Research groups
items:
  - title: NCBI GEO
    group: databases
    description: Public functional genomics datasets and study records.
    provider: NCBI
    url: https://www.ncbi.nlm.nih.gov/geo/
    visible: true
    order: 1
  - title: Ensembl
    group: databases
    description: Genome annotation, gene models and cross-species orthologues.
    provider: Ensembl
    url: https://www.ensembl.org/
    visible: true
    order: 2
  - title: UCSC Genome Browser
    group: databases
    description: Explore genome assemblies and genomic annotation tracks.
    provider: UC Santa Cruz
    url: https://genome.ucsc.edu/
    visible: true
    order: 3
  - title: CZ CELLxGENE Discover
    group: databases
    description: Discover and explore curated single-cell datasets.
    provider: Chan Zuckerberg Initiative
    url: https://cellxgene.cziscience.com/
    visible: true
    order: 4
  - title: Human Protein Atlas
    group: databases
    description: RNA expression and protein localization across tissues and cells.
    provider: Human Protein Atlas
    url: https://www.proteinatlas.org/
    visible: true
    order: 5
  - title: RetNet
    group: databases
    description: Genes and loci associated with inherited retinal diseases.
    provider: Retinal Information Network
    url: https://retnet.org/
    visible: true
    order: 6
  - title: Seurat
    group: tools
