groups:
  - id: genomics
    title: Genomics & data analysis
    description: From multi-omics data to regulatory mechanisms.
  - id: imaging
    title: Imaging & phenotyping
    description: Spatial images, behavior, and quantitative phenotypes.
  - id: productivity
    title: Research productivity
    description: Codex and Zotero plugins for research workflows and scientific reading.
projects:
  - title: Biomed Workbench
    visible: true
    recommended: false
    group: productivity
    category: Codex plugin
    description: A Codex plugin connecting scientific questions, multi-omics analysis, evidence interpretation, and publication deliverables.
    url: https://github.com/JunyanKang/biomed-workbench
    license: Apache-2.0
  - title: Paper Voice
    visible: true
    recommended: true
    group: productivity
    category: Zotero plugin
    description: Offline paper narration and synchronized translation for Zotero, with multilingual reading support.
    url: https://github.com/JunyanKang/paper-voice
    releases: https://github.com/JunyanKang/paper-voice/releases
    license: MIT
  - title: SCENIC+ GRN Workflow
    visible: true
    recommended: false
    group: genomics
    category: Regulatory genomics
    description: Reproducible SCENIC+ workflows for matched snRNA/snATAC and scMultiome data, including environment setup, motif resources, and network analysis.
    url: https://github.com/JunyanKang/scenicplus-grn-workflow
    license: MIT
  - title: SpatialPlexomera
    visible: true
    recommended: false
    group: imaging
    category: Spatial image analysis
    description: Guided multiplex spatial image analysis, from composite visualization and cell typing to spatial measurements and figure exports.
    url: https://github.com/JunyanKang/SpatialPlexomera
    upstream: https://github.com/fengshuoliu/SpatialPlexomera
    license: MIT
  - title: ERG Viewer
    visible: true
    recommended: true
    group: imaging
    category: Visual electrophysiology
    description: A desktop workstation for OPTOPROBE ERG and FVEP recordings, with dual-eye waveform review, manual landmark annotation, cohort analysis, and figure and source-data exports.
    url: https://github.com/JunyanKang/ERG_Viewer
    releases: https://github.com/JunyanKang/ERG_Viewer/releases
    license: License not specified
  - title: MouseScope
    visible: true
    recommended: false
    group: imaging
    category: Behavioral phenotyping
    description: A desktop platform for mouse behavioral video analysis, including open field, object recognition, maze, swim, and suspension assays.
    url: https://github.com/JunyanKang/MouseScope
    upstream: https://github.com/aDarkMaker/MouseScope
    license: GPL-3.0
